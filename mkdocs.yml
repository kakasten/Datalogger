site_name: Datalogger
site_description: Datalogger and telemetry system documentation
site_author: Kakasten

repo_name: kakasten/Datalogger
repo_url: https://github.com/kakasten/Datalogger

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - tables

nav:
  - Home: index.md

  - Getting Started:
      - Introduction: getting-started/introduction.md
      - Repository: getting-started/repository.md

  - Architecture:
      - Overview: architecture/overview.md
      - Hardware Architecture: architecture/hardware.md
      - Software Architecture: architecture/software.md
      - Communication Architecture: architecture/communication.md

  - Hardware:
      - Overview: hardware/overview.md
      - Master: hardware/master.md
      - Slave: hardware/slave.md
      - Sensors: hardware/sensors.md

  - Firmware:
      - Overview: firmware/overview.md
      - Architecture: firmware/architecture.md
      - FreeRTOS: firmware/freertos.md
      - Drivers: firmware/drivers.md

  - Communication:
      - Overview: communication/overview.md
      - CAN: communication/can.md